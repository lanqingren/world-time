name: build

# Pushing a v* tag builds the Windows installer and the Mac disk image into a draft release for
# that tag, then publishes it together with latest.json, which installed clocks check for updates.
# A manual run only builds them (see the run's artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          # one download for both Apple silicon and Intel Macs; updates use the packed-up app
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update downloads: the clocks only install what this key signed
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: World Time ${{ github.ref_name }}
          releaseDraft: true
          # written by the publish job instead, once both builds are in
          includeUpdaterJson: false
          releaseBody: |
            Windows：下载 `x64-setup.exe`，双击安装。
            Mac（Apple 芯片和 Intel 都能用）：下载 `universal.dmg`，打开后把 World Time 拖进“应用程序”。没有 Apple 开发者签名，第一次打开如果提示无法验证开发者，到“系统设置 → 隐私与安全性”最下面点“仍要打开”。

      - uses: actions/upload-artifact@v4
        with:
          name: world-time-${{ runner.os }}
          path: ${{ matrix.files }}

  # latest.json tells installed clocks about the new version. It is written once both builds are
  # in (two jobs editing it at once can drop one side), and only then does the release go public.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Write latest.json
        run: |
          gh release download "$TAG" --pattern '*.sig' --dir sig
          mac=$(cd sig && ls *.app.tar.gz.sig)
          win=$(cd sig && ls *-setup.exe.sig)
          url="https://github.com/$GH_REPO/releases/download/$TAG"
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macsig "$(cat "sig/$mac")" --arg macurl "$url/${mac%.sig}" \
            --arg winsig "$(cat "sig/$win")" --arg winurl "$url/${win%.sig}" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $macsig, url: $macurl},
              "darwin-x86_64": {signature: $macsig, url: $macurl},
              "windows-x86_64": {signature: $winsig, url: $winurl}}}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      # a published release marked Latest is what the repo's front page shows and where the clocks look
      - run: gh release edit "$TAG" --draft=false --prerelease=false --latest
