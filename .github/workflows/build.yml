name: build

# Pushing a v* tag builds the Windows installer and the Mac disk image and attaches both
# to a GitHub release for that tag. A manual run only builds them (see the run's artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          # one download for both Apple silicon and Intel Macs
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: World Time ${{ github.ref_name }}
          releaseBody: |
            Windows：下载 `x64-setup.exe`，双击安装。
            Mac（Apple 芯片和 Intel 都能用）：下载 `universal.dmg`，打开后把 World Time 拖进“应用程序”。没有 Apple 开发者签名，第一次打开如果提示无法验证开发者，到“系统设置 → 隐私与安全性”最下面点“仍要打开”。

      - uses: actions/upload-artifact@v4
        with:
          name: world-time-${{ runner.os }}
          path: ${{ matrix.files }}

      # a normal release marked Latest is what the repo's front page shows (pre-releases are left out)
      - if: ${{ !cancelled() && github.ref_type == 'tag' }}
        run: gh release edit "${{ github.ref_name }}" --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
