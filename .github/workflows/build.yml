name: build

# Pushing a v* tag builds the Windows installer and attaches it to a GitHub release for that tag.
# A manual run only builds it (download it from the run's artifacts).
# The Mac app is built locally: pnpm tauri build --bundles app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: World Time ${{ github.ref_name }}
          releaseBody: Windows 安装包，下载 `-setup.exe` 双击安装。Mac 版在本地打包。

      - uses: actions/upload-artifact@v4
        with:
          name: world-time-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      # a normal release marked Latest is what the repo's front page shows (pre-releases are left out)
      - if: ${{ !cancelled() && github.ref_type == 'tag' }}
        run: gh release edit "${{ github.ref_name }}" --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
